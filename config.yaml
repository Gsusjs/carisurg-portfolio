# CariSurg Triage — training configuration

seed: 42

data:
  raw_path: "data/raw/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"
  test_size: 0.20

final_models: ["logistic_regression"]

models:
  logistic_regression:
    max_iter: 1000
    random_state: 42
  decision_tree:
    max_depth: 5
  random_forest:
    n_estimators: 300
    class_weight: "balanced"
  gradient_boosting: {}
